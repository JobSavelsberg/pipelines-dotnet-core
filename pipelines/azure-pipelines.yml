# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  - master

parameters:
  - name: alerts
    displayName: "Alerts to run"
    type: stringList
    default:
      - teams
      - curl
      - fancy
    values:
      - teams
      - curl
      - fancy
  - name: buildOutcome
    displayName: "Build outcome"
    type: string
    default: succeeded
    values:
      - succeeded
      - succeededWithIssues
      - failed

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: "Release"

stages:
  - stage: build
    displayName: "Build"
    jobs:
      - job: build
        steps:
          - script: dotnet build --configuration $(buildConfiguration)
            displayName: "dotnet build $(buildConfiguration)"
          - ${{ if eq(parameters.buildOutcome, 'succeededWithIssues') }}:
            - script: exit 1
              displayName: "Mark build as partially successful"
              continueOnError: true
          - ${{ if eq(parameters.buildOutcome, 'failed') }}:
            - script: exit 1
              displayName: "Fail build as requested"
  - ${{ if containsValue(parameters.alerts, 'teams') }}:
    - template: /pipelines/templates/stages/alert-teams.yml
  - ${{ if containsValue(parameters.alerts, 'curl') }}:
    - template: /pipelines/templates/stages/alert-teams-curl.yml
  - ${{ if containsValue(parameters.alerts, 'fancy') }}:
    - template: /pipelines/templates/stages/alert-teams-fancy.yml
