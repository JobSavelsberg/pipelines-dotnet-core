stages:
  - stage: alert_curl
    displayName: "Alert (CURL)"
    dependsOn: build
    condition: always()
    jobs:
      - job: alert_curl
        variables:
          buildResult: $[ stageDependencies.build.build.result ]
        steps:
          - checkout: none
          - script: |
              set -euo pipefail
              PAYLOAD=$(jq -n --arg text "$NOTIFICATION_MESSAGE" '{
                type: "message",
                attachments: [{
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [{ type: "TextBlock", text: $text, wrap: true }]
                  }
                }]
              }')
              curl -sS --fail-with-body \
                --retry 3 --retry-delay 2 --retry-connrefused \
                -X POST \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                -w "\nTeams webhook responded: %{http_code}\n" \
                "$TEAMS_WEBHOOK_URL"
            displayName: "Send Teams notification"
            env:
              TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
              NOTIFICATION_MESSAGE: "Test alert (CURL) from $(Build.DefinitionName), build $(Build.BuildNumber), result of build stage: $(buildResult)"
