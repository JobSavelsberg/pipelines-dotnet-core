stages:
  - stage: alert_curl
    displayName: "Alert (CURL)"
    dependsOn: build
    condition: succeededOrFailed()
    jobs:
      - job: alert_curl
        steps:
          - script: |
              curl --fail-with-body -sS -X POST "$TEAMS_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "{\"text\": \"$NOTIFICATION_MESSAGE\"}"
            displayName: "Send Teams notification"
            env:
              TEAMS_WEBHOOK_URL: $(TEAMS_WEBHOOK_URL)
              NOTIFICATION_MESSAGE: "Test alert (CURL) from $(Build.DefinitionName), build $(Build.BuildNumber), result of build stage: $(Agent.JobStatus)"
